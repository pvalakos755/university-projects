<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Register</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>

		<main class="container">
			<form action="#" 
				  th:action="@{/save}" th:object="${user}" method="post">
				<h3>Registration</h3>
				<input type="text" th:field="*{username}" placeholder="User Name" /> <br/><br/>
				<input type="password" th:field="*{password}" placeholder="Password" /> <br/><br/>
				<select th:field="*{role}" required>
					<option value="STUDENT">Student</option>
					<option value="PROFESSOR">Professor</option>
					<option value="COMPANY">Company</option>
					<option value="TRAINEESHIP_COMMITTEE">Traineeship Committee</option>
				</select> <br/><br/>
    
				<button type="submit" class="btn btn-info col-2">Register</button> 
    
				<a th:href="@{/}" class="btn btn-outline-primary col-2">← Home</a>
				
				<div th:if="${param.error}" class="alert alert-danger" role="alert">
		      	  Registration Error.
		    	</div>
    
				<div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}">
				</div>
			</form>
		</main>
		
		<footer class="container">
			<p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
		</footer>
	</body>
</html>
