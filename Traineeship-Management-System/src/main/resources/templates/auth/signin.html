<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Login</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>

		<main class="container">
	
			<form th:action="@{/login}" method="POST" >
				<h3 th:text="Login"></h3>
		        <input type="text" name="username" th:placeholder="Username" /> <br /><br />
		        <input type="password" th:placeholder="Password" name="password" /> <br /><br />
		        <button type="Submit" class="btn btn-info col-2"> Login </button>
		        <a th:href="@{/}" class="btn btn-outline-primary col-2">← Home</a>
		        
		        <br>
		        <br>
		        <div th:if="${param.error}" class="alert alert-danger" role="alert">
		      	  Username or Password is invalid.
		    	</div>
		    	
		   		<div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}">
				</div>
				<div th:if="${wrongMessage}" class="alert alert-danger" role="alert" th:text="${wrongMessage}">
				</div>
		    </form>
		</main>
		
		<footer class="container">
			<p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
		</footer>
	</body>
</html>
