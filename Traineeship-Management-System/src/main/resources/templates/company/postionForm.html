<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Profile Form</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h3>Position Form</h3>
			<hr>
		
			<p class="h4 mb-4">Create a new position</p>
		
			<form th:action="@{/company/savePosition}"
							 th:object="${position}" method="POST">
			
				<input type="hidden" th:field="*{id}" />
				
				<label>Title:</label>
				<input type="text" required th:field="*{title}"
						class="form-control mb-4 col-4" placeholder="Enter title">
						
				<label>Description:</label>
				<input type="text" required th:field="*{description}"
						class="form-control mb-4 col-4" placeholder="Enter description">
				
				<label>Traineeship Position Period:</label>
				<br>
				<div class="row mb-3">
					<div class="col">
						<label for="fromDate" class="form-label">From:</label>
						<input type="date" th:field="*{fromDate}" class="form-control" id="fromDate" required>
					</div>
        			<div class="col">
            			<label for="toDate" class="form-label">To:</label>
            			<input type="date" th:field="*{toDate}" class="form-control" id="toDate" required>
        			</div>
    			</div>
				
				<label class="form-label">Required Skills:</label>
				<select class="form-select" required multiple th:field="*{skills}">
					<option th:each="p : ${skills}" th:value="${p.id}" th:text="${p.name}" />
				</select>
				<br>
				<label class="form-label">Topics of Interests:</label>
				<select class="form-select" required multiple th:field="*{topics}">
					<option th:each="p : ${interests}" th:value="${p.id}" th:text="${p.name}" />
				</select>
				<br>
				<button type="submit" class="btn btn-success col-2 btn-sm mb-3">Create</button>
			</form>
			
	        <br><hr><br>
	
	        <p>
	            <a href="/company/dashboard" class="btn btn-outline-danger btn-sm mb-3">✖ Cancel</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
