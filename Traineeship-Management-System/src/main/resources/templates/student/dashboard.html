<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Dashboard</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h2>Welcome to Student Dashboard</h2>
	        <hr>

			<nav th:if="${student==null}" class="navbar navbar-light bg-light">
				<div class="container-fluid">
					<a class="navbar-brand" href="studentShowFormForAdd">Create Profile</a>
				</div>
			</nav>
			<nav th:if="${student!=null}" class="navbar navbar-light bg-light">
				<div class="container-fluid">
					<a class="navbar-brand" href="viewProfile">View profile</a>
				</div>
			</nav>
			<br>
			<nav th:if="${student!=null && student.lookingForTraineeship.name()=='NOT_LOOKING'}" class="navbar navbar-light bg-light">
				<div class="container-fluid">
					<a class="navbar-brand" href="interestForPosition">Declare interest about a traineeship position</a>
				</div>
			</nav>
			<br>
			<div th:if="${student!=null && student.lookingForTraineeship.name()=='LOOKING'}" class="alert alert-success" role="alert">
				Wait to be assigned to an internship position
			</div>
			
			<nav th:if="${student!=null && student.lookingForTraineeship.name()=='ASSIGNED'}" class="navbar navbar-light bg-light">
				<div class="container-fluid">
					<a class="navbar-brand" href="viewPosition">View my traineeship position</a>
				</div>
			</nav>
			
			<br>
	        <p>
	            <a th:href="@{/logout}" class="btn btn-danger btn-sm mb-3">Logout</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
