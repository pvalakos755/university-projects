<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Profile</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h2>View Profile</h2>
	        <hr>	
			<table class="table table-bordered">
				<tbody>
					<tr>
						<th>Name:</th>
						<td th:text="${student.name}"></td>
					</tr>
					<tr>
						<th>AM:</th>
						<td th:text="${student.universityIdNumber}"></td>
					</tr>
					<tr>
						<th>Preferred location:</th>
						<td th:text="${student.preferredLocation.name}"></td>
					</tr>
					<tr>
					    <th>Interests:</th>
					    <td>
					        <ul>
					            <li th:each="interest : ${student.interests}" th:text="${interest.name}"></li>
					        </ul>
					    </td>
					</tr>
					<tr>
					    <th>Skills:</th>
					    <td>
					        <ul>
					            <li th:each="skill : ${student.skills}" th:text="${skill.name}"></li>
					        </ul>
					    </td>
					</tr>
				</tbody>	
			</table>
	
	        <br><br><hr><br><br>
	
	        <p>
	            <a href="/student/dashboard" class="btn btn-outline-primary btn-sm mb-3">← Dashboard</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
