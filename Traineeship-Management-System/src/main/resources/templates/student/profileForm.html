<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Profile Form</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h3>Profile Form</h3>
			<hr>
		
			<p class="h4 mb-4">Create your profile</p>
		
			<form th:action="@{/student/save}"
							 th:object="${student}" method="POST">
			
				<input type="hidden" th:field="*{id}" />
				<input type="hidden" th:field="*{username}" />
				<input type="hidden" th:field="*{lookingForTraineeship}" />
				
				<label>Full name:</label>
				<input type="text" required th:field="*{name}"
						class="form-control mb-4 col-4" placeholder="Enter full name">
						
				<label>University id number:</label>
				<input type="text" required th:field="*{universityIdNumber}"
						class="form-control mb-4 col-4" placeholder="Enter university id number">
						
				<label class="form-label">Interests:</label>
				<select class="form-select" required multiple th:field="*{interests}">
					<option th:each="p : ${interests}" th:value="${p.id}" th:text="${p.name}" />
				</select>
				<br>
				
				<label class="form-label">Skills:</label>
				<select class="form-select" required multiple th:field="*{skills}">
					<option th:each="p : ${skills}" th:value="${p.id}" th:text="${p.name}" />
				</select>
				<br>
				
				<label class="form-label">Preferred location:</label>
				<select class="form-select" required th:field="*{preferredLocation}">
					<option th:each="p : ${locations}" th:value="${p.id}" th:text="${p.name}" />
				</select>
				<br>
				<button type="submit" class="btn btn-success col-2 btn-sm mb-3">Create</button>
			</form>
			
	        <br><hr><br>
	
	        <p>
	            <a href="/student/dashboard" class="btn btn-outline-danger btn-sm mb-3">✖ Cancel</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
