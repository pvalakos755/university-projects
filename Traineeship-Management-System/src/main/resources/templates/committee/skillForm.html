<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Skill Form</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h3>Skill Form</h3>
			<hr>
		
			<p class="h4 mb-4">Skill</p>
		
			<form th:action="@{/committee/skills}"
							 th:object="${skill}" method="POST">
			
				<input type="hidden" th:field="*{id}" />
				
				<input type="text" th:field="*{name}"
						class="form-control mb-4 col-4" placeholder="Enter skill name here">					
				<button type="submit" class="btn btn-success col-2 btn-sm mb-3">Save</button>
							
			</form>
			
	        <br><hr><br>
	
	        <p>
	            <a href="/committee/dashboard" class="btn btn-outline-primary btn-sm mb-3">← Dashboard</a>
	            <a href="/committee/skills" class="btn btn-outline-danger btn-sm mb-3">✖ Cancel</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
