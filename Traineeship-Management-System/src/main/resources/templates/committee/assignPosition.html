<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
		<title>Students</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h2>Positions</h2>
	        <hr>
	        
			<div th:if="${#lists.isEmpty(positions)}" class="alert alert-danger" role="alert">
				No positions found for this student
			</div>
	        
	        <div th:if="${!#lists.isEmpty(positions)}">
				<table class="table table-bordered" >
					<thead>
						<tr>
							<th>Title</th>
							<th>Description</th>
							<th>From - To</th>
							<th>Required Skills</th>
							<th>Topics of interests</th>
							<th>Action</th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="position : ${positions}">
							<td th:text="${position.title}"/>
							<td th:text="${position.description}"/>
							 <td>
							 	<span th:text="${#temporals.format(position.fromDate, 'dd/MM/yyyy')}"></span> - <span th:text="${#temporals.format(position.toDate, 'dd/MM/yyyy')}"></span>
							</td>
							<td>
								<ul class="mb-0">
									<li th:each="skill : ${position.skills}" th:text="${skill.name}"></li>
								</ul>
							</td>
							<td>
								<ul class="mb-0">
									<li th:each="topic : ${position.topics}" th:text="${topic.name}"></li>
								</ul>
							</td>
							<td>
								<a th:href="@{/committee/assignPosition(positionId=${position.id},studentUsername=${studentUsername})}"
								   class="btn btn-info btn-sm">
									Assign
								</a>
							</td>
						</tr>
					</tbody>		
				</table>
			</div>
	
	        <br><br><hr><br><br>
	
	        <p>
	            <a href="/committee/dashboard" class="btn btn-outline-primary btn-sm mb-3">← Dashboard</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
