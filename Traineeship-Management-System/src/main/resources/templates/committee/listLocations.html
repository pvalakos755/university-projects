<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Locations</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h2>Locations</h2>
	        <hr>
			<a th:href="@{/committee/locationShowFormForAdd}"
				class="btn btn-primary btn-sm mb-3">
				Add Location
			</a>
			
			
			<table class="table table-bordered">
				<thead>
					<tr>
						<th>Location</th>
						<th>Action</th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="location : ${locations}">
						<td th:text="${location.name}" />	
						<td>
							<a th:href="@{/committee/locationShowFormForUpdate(id=${location.id})}"
							   class="btn btn-info btn-sm">
								Update
							</a>
						</td>
						
						
					</tr>
				</tbody>		
			</table>
	
	        <br><br><hr><br><br>
	
	        <p>
	            <a href="/committee/dashboard" class="btn btn-outline-primary btn-sm mb-3">← Dashboard</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
