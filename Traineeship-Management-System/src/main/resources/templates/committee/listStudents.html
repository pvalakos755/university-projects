<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
		<title>Students</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h2>Students</h2>
	        <hr>
			<table class="table table-bordered">
				<thead>
					<tr>
						<th>Name</th>
						<th>AM</th>
						<th>Preferred Location</th>
						<th>Interests</th>
						<th>Skills</th>
						<th>Action</th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="student : ${students}">
						<td th:text="${student.name}"></td>
						<td th:text="${student.universityIdNumber}"></td>
						<td th:text="${student.preferredLocation.name}"></td>
						<td>
							<ul class="mb-0">
								<li th:each="interest : ${student.interests}" th:text="${interest.name}"></li>
							</ul>
						</td>
						<td>
							<ul class="mb-0">
								<li th:each="skill : ${student.skills}" th:text="${skill.name}"></li>
							</ul>
						</td>
						<td>
							<div class="dropdown">
								<button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Search Position</button>
								<ul class="dropdown-menu">
						            <li><a class="dropdown-item" th:href="@{/committee/findPositions(studentUsername=${student.username},strategy='interests')}">Interests</a></li>
						            <li><a class="dropdown-item" th:href="@{/committee/findPositions(studentUsername=${student.username},strategy='location')}">Location</a></li>
						            <li><a class="dropdown-item" th:href="@{/committee/findPositions(studentUsername=${student.username},strategy='all')}">All</a></li>
						        </ul>
						    </div>
						</td>
					</tr>
				</tbody>		
			</table>
	
	        <br><br><hr><br><br>
	
	        <p>
	            <a href="/committee/dashboard" class="btn btn-outline-primary btn-sm mb-3">← Dashboard</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
