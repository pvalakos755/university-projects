<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	
		<title>Evaluate Position</title>
		<style>
	        html, body { height: 100%; margin: 0;}
	        body { display: flex; flex-direction: column; min-height: 100vh; }
	        main { flex: 1; }
	        footer { background-color: #f5f5f5; padding: 1em; text-align: center; }
	    </style>
	</head>
	
	<body>
	    <main class="container">
	        <h3>Evaluate Position</h3>
			<hr>
		
			<p class="h4 mb-4">Evaluate the position</p>
		
			<form th:action="@{/professor/saveEvaluation}"
							 th:object="${evaluation}" method="POST">
			
				<input type="hidden" name="positionId" th:value="${positionId}" />

			    <label>Motivation (1–5):</label>
			    <input type="number" required class="form-control mb-4 col-4" th:field="*{motivation}" min="1" max="5" /><br>
			
			    <label>Effectiveness (1–5):</label>
			    <input type="number" required class="form-control mb-4 col-4" th:field="*{effectiveness}" min="1" max="5" /><br>
			
			    <label>Efficiency (1–5):</label>
			    <input type="number" required class="form-control mb-4 col-4" th:field="*{efficiency}" min="1" max="5" /><br>
			    
			    <label>Facilities (1–5):</label>
			    <input type="number" required class="form-control mb-4 col-4" th:field="*{facilities}" min="1" max="5" /><br>
			    
			    <label>Guidance (1–5):</label>
			    <input type="number" required class="form-control mb-4 col-4" th:field="*{guidance}" min="1" max="5" /><br>
				<br>
				<button type="submit" class="btn btn-success col-2 btn-sm mb-3">Save</button>
			</form>
			
	        <br><hr><br>
	
	        <p>
	            <a href="/professor/listAssignedTraineeships" class="btn btn-outline-danger btn-sm mb-3">✖ Cancel</a>
	        </p>
	    </main>
	
	    <footer class="container">
	        <p>&copy; 2025 Traineeship Management Application. All rights reserved.</p>
	    </footer>
	</body>
</html>
